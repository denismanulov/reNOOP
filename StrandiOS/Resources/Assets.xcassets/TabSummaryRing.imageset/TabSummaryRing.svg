  <path fill="#000000" fill-rule="evenodd" d="M 13.000 1.333 A 11.667 11.667 0 1 1 13.000 24.667 A 11.667 11.667 0 1 1 13.000 1.333 Z M 13.000 5.833 A 7.167 7.167 0 1 0 13.000 20.167 A 7.167 7.167 0 1 0 13.000 5.833 Z M 13.814 1.361 A 11.667 11.667 0 0 1 15.648 1.638 A 2.800 2.800 0 0 1 14.933 6.098 A 7.167 7.167 0 0 0 13.500 5.850 A 2.250 2.250 0 0 0 13.814 1.361 Z"/>
</svg>
