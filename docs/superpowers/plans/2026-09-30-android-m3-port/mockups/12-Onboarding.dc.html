<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Первый запуск — браслет</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
body{margin:0;background:#E9EFE9}
.scr{--p:#006C4C;--onp:#FFFFFF;--pc:#89F8C7;--onpc:#002114;--sc:#CFE9D9;--onsc:#0A1F16;--srf:#F5FBF5;--on:#171D1A;--onv:#404943;--c1:#EFF5EF;--c3:#E4EAE3;--c4:#DEE4DE;--olv:#BFC9C1;font-family:'Google Sans Flex','Google Sans',Roboto,sans-serif;color:var(--on);background:var(--srf);position:relative;overflow:hidden;box-sizing:border-box}
.scr.dark{--p:#6CDBAC;--onp:#003826;--pc:#005139;--onpc:#89F8C7;--sc:#354B40;--onsc:#CFE9D9;--srf:#0F1511;--on:#DEE4DE;--onv:#BFC9C1;--c1:#171D1A;--c3:#252B28;--c4:#303632;--olv:#404943}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="scr {{mode}}" style="width: 412px; height: 915px; display: flex; flex-direction: column">

<div style="display: flex; gap: 6px; padding: 20px 24px 0" aria-label="Шаг 2 из 4"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--p)"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--p)"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--c4)"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: var(--c4)"></span></div>

<main style="flex-grow: 1; padding: 40px 24px 0; display: flex; flex-direction: column; gap: 16px">
<span style="width: 64px; height: 64px; border-radius: 22px; background: var(--pc); color: var(--onpc); display: flex; align-items: center; justify-content: center"><span class="ms f" style="font-size: 36px">bluetooth_searching</span></span>
<h1 style="margin: 8px 0 0; font-size: 36px; line-height: 44px; font-weight: 400">Найдите браслет</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--onv)">Наденьте его поплотнее на запястье или бицепс, датчиком к коже, и закройте приложение WHOOP.</p>

<div role="radiogroup" aria-label="Модель" style="display: flex; flex-direction: column; gap: 2px; margin-top: 16px">
<button role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 8px 16px; border-radius: 24px 24px 4px 4px; background: var(--sc); color: var(--onsc); text-align: left"><span class="ms f">radio_button_checked</span><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 500">WHOOP 5.0 / MG</span><span style="font-size: 14px">Браслет 2025 года</span></span><span class="ms f">watch</span></button>
<button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 8px 16px; border-radius: 4px 4px 24px 24px; background: var(--c1); text-align: left"><span class="ms" style="color: var(--onv)">radio_button_unchecked</span><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; font-weight: 500">WHOOP 4.0</span><span style="font-size: 14px; color: var(--onv)">Браслет 2021 года</span></span><span class="ms" style="color: var(--onv)">watch</span></button>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: var(--c1); margin-top: 8px">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke-width="3" style="stroke: var(--c4)"></circle><path d="M12 3 A9 9 0 0 1 21 12" fill="none" stroke-width="3" stroke-linecap="round" style="stroke: var(--p)"></path></svg>
<span style="font-size: 14px; color: var(--onv)">Ищем браслет поблизости…</span>
</div>
</main>

<footer style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px 28px">
<button style="height: 48px; padding: 0 16px; border-radius: 24px; color: var(--p); font-size: 16px; font-weight: 500">Настроить позже</button>
<a href="Main.dc.html" style="height: 48px; padding: 0 28px; border-radius: 24px; background: var(--p); color: var(--onp); font-size: 16px; font-weight: 500; display: flex; align-items: center; text-decoration: none">Искать</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
renderVals() {
return { mode: (this.props.dark ?? false) ? 'dark' : '' };
}
}
</script>
</body>
</html>
